<table><thead><tr><th>Location</th><th>Live (Sealed)</th><th>Live (Loose)</th><th>Blank (Sealed)</th><th>Blank (Loose)</th></tr></thead><tbody>${AMMO.map(a=>`<tr><td>${esc(a.loc)}</td><td>${esc(a.live_s)}</td><td>${esc(a.live_l)}</td><td>${esc(a.blank_s)}</td><td>${esc(a.blank_l)}</td></tr>`).join("")}</tbody></table>
<p class="text-xs text-red mt-2 font-semibold">Live and blank ammunition must NEVER be stored together. Live ammo boxes marked with red scotch tape cross.</p></section>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-3">Code Words</h2>
<table><thead><tr><th>Word</th><th>Meaning</th><th>Used By</th></tr></thead><tbody>${CODE_WORDS.map(c=>`<tr><td class="mono font-semibold">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</tbody></table></section>
<section class="grid-2 mb-4">
${[["map","Map","Deployment areas with GPS pins"],["timeline","Timeline","Exercise-duration tasks by Daily / Continuous / Immediate"],["comms","Comms & Rules","Frequencies, code words, Do's/Don'ts"],["dailyops","Daily Ops","Maj Cmt + Bornona narratives"],["codirectives","CO's Directives","Key command directives (06 Jul 2026)"]].map(([id,t,d])=>`<button data-g="${id}" class="card p-4" style="text-align:left"><div class="font-bold">→ ${t}</div><div class="text-sm text-ink-soft">${d}</div></button>`).join("")}
</section>`;
w.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{tab=b.dataset.g;render();});
m.appendChild(w);
}

/* ===== MAP ===== */
function rMap(m){
const w=el(`<div class="container" style="padding:16px"><div class="card"><div class="map-layout"><div><div id="mapdiv" class="map-container"></div></div><aside class="map-sidebar"><div class="text-xs uppercase tracking-widest text-ink-soft">Selected feature</div><div id="mapinfo" class="mt-2 text-sm text-ink-soft">Tap any marker to see details.</div><hr style="border:none;border-top:1px solid var(--rule);margin:14px 0"/><div class="text-xs uppercase tracking-widest text-ink-soft mb-2">Legend</div><div class="space-y-2" style="font-size:12px"><div><span class="ord-marker" style="background:#4C5142;margin-right:6px">HQ</span>Home station</div><div><span class="ord-marker" style="background:#1F4E79;margin-right:6px">CTL</span>Control HQ</div><div><span class="ord-marker" style="background:#45592F;margin-right:6px">BN</span>Forward Bn</div><div><span class="ord-marker" style="background:#A6332F;margin-right:6px">GUN</span>Gun Position</div></div><p class="text-xs text-ink-soft italic mt-4">Coordinates approximate/illustrative. Authoritative grids on map sheets 79 I/15 and 79 M/3.</p></aside></div></div></div>`);
m.appendChild(w);
setTimeout(()=>{
const md=document.getElementById("mapdiv"),info=document.getElementById("mapinfo");
if(!md||typeof L==="undefined")return;
if(leafletMap){leafletMap.remove();leafletMap=null;}
leafletMap=L.map(md,{center:[23.43,91.08],zoom:11});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:18}).addTo(leafletMap);
setTimeout(()=>leafletMap.invalidateSize(),100);
LOCATIONS.forEach(loc=>{
const s=TYPE_STYLE[loc.type];
const ic=L.divIcon({className:'',html:'<div style="background:'+s.fill+';color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);padding:2px 5px;border-radius:3px;font-family:ui-monospace,monospace;font-size:9px;font-weight:600;white-space:nowrap">'+s.icon+' '+esc(loc.name)+'</div>',iconSize:[140,20],iconAnchor:[70,10]});
const mk=L.marker([loc.lat,loc.lng],{icon:ic}).addTo(leafletMap);
mk.bindPopup('<b>'+esc(loc.name)+'</b><br><span style="font-family:monospace;font-size:11px">'+loc.lat.toFixed(4)+', '+loc.lng.toFixed(4)+'</span><br>'+esc(loc.note));
mk.on("click",()=>{info.innerHTML=`<div class="font-bold text-olive-dark">${esc(loc.name)}</div><div class="mono text-xs text-ink-soft mt-1">${loc.lat.toFixed(4)}°N, ${loc.lng.toFixed(4)}°E</div><p class="text-sm mt-2">${esc(loc.note)}</p>`;});
});
},0);
}

/* ===== TIMELINE ===== */
function rTimeline(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
w.appendChild(el(`<h2 class="text-lg font-bold mb-3">During Exercise — 05–14 Jul 2026</h2>`));
const groups={},order=[];
TIMELINE_DURING.forEach(item=>{
if(!groups[item.tag]){groups[item.tag]=[];order.push(item.tag);}
groups[item.tag].push(item.e);
});
order.forEach(tag=>{
const card=el(`<div class="card mb-4"><div class="p-3 border-b"><h2 class="text-lg font-bold" style="margin:0">${esc(tag)}</h2></div><div></div></div>`);
const body=card.querySelector("div:last-child");
groups[tag].forEach(e=>{
body.appendChild(el(`<div class="ci"><div style="flex:1"><span class="itxt text-sm">${esc(e)}</span></div></div>`));
});
w.appendChild(card);
});
m.appendChild(w);
}

w.innerHTML=`
<div class="comms-hero"><h2>📡 Communications Plan</h2><p>Nets, code words, and frequencies for EX BOJRO AGHAT</p></div>
<section class="grid-4 mb-4">
<div class="info-tile"><div class="ic">📻</div><div class="text-xs uppercase tracking-widest text-ink-soft mt-1">Frequencies</div><div class="mono text-sm mt-1">${COMMS.freqs}</div></div>
<div class="info-tile"><div class="ic">🔤</div><div class="text-xs uppercase tracking-widest text-ink-soft mt-1">Freq Change Word</div><div class="mono text-sm mt-1">${COMMS.freqChange}</div></div>
<div class="info-tile"><div class="ic">⏱️</div><div class="text-xs uppercase tracking-widest text-ink-soft mt-1">Comms Established By</div><div class="mono text-sm mt-1">${COMMS.commsBy}</div></div>
<div class="info-tile"><div class="ic">📶</div><div class="text-xs uppercase tracking-widest text-ink-soft mt-1">SDS</div><div class="mono text-sm mt-1">${COMMS.sds}</div></div>
</section>
<section class="card p-5 mb-4">
<h2 class="text-lg font-bold mb-2">🔗 Net Structure</h2>
<div class="text-sm mb-3">HF: ${COMMS.hfLink}<br>VHF: ${COMMS.vhfLink}<br>Walkie-Talkies where available</div>
<div class="text-xs uppercase tracking-widest text-ink-soft mb-2">Radio Silence Codes</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">${RADIO_SILENCE.map(r=>`<span class="chip ${r[0]==='BIJLI'?'chip-red':'chip-olive'}">${r[0]} — ${r[1]}</span>`).join("")}</div>

<section class="card p-5 mb-4">

<div style="display:flex;flex-wrap:wrap;gap:8px">${CODE_WORDS.map(c=>`<span class="chip ${c[0]==='BIJLI'?'chip-red':'chip-blue'}">${c[0]} — ${c[1]}</span>`).join("")}</div>
</section>
<section class="card p-5 mb-4">
<h2 class="text-lg font-bold mb-3">✅ Do's (All Ranks)</h2>
<div class="space-y-2">${DOS.map(d=>`<div class="rule-item ok"><span class="rule-badge ok">✓</span><span class="text-sm">${esc(d)}</span></div>`).join("")}</div>

</section>`;

}

/* ===== DAILY OPS ===== */
function rDailyOps(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
[...DAILY_OPS].reverse().forEach((day,idx)=>{
const det=el(`<details class="card mb-4" ${idx===0?'open':''}><summary><span class="text-lg font-bold">${esc(day.title)} — ${esc(day.date)}</span></summary><div class="border-t p-3"></div></details>`);
const body=det.querySelector(":scope > div");
day.subunits.forEach(su=>{
const card=el(`<div class="card mb-3"><div class="p-3 border-b" style="background:var(--paper-dark)"><h3 class="font-bold text-sm uppercase tracking-widest text-olive-dark" style="margin:0">${esc(su.name)}</h3></div><div style="overflow-x:auto"><table><thead><tr><th>Ser</th><th>Task</th><th>Timing</th><th>Location</th><th>Ptl Brief</th><th>Comd</th><th>Str</th><th>Veh</th><th>Umpire</th></tr></thead><tbody></tbody></table></div><div id="basis_${day.date.replace(/\W/g,'')}_${su.name.replace(/\W/g,'')}"></div></div>`);
const tbody=card.querySelector("tbody");
const basisDiv=card.querySelector("div:last-child");
su.tasks.forEach(t=>{
tbody.appendChild(el(`<tr><td>${t.ser}</td><td class="font-semibold">${esc(t.task)}</td><td class="mono">${esc(t.timing)}</td><td class="mono">${esc(t.loc)}</td><td>${esc(t.brief)}</td><td>${esc(t.comd)}</td><td class="mono">${esc(t.str)}</td><td>${esc(t.veh)}</td><td>${esc(t.ump)}</td></tr>`));
if(t.basis){
const isWarn=t.basis.includes("⚠");
basisDiv.appendChild(el(`<div class="${isWarn?'warn-box':'directive-box'} mb-2" style="margin:0 12px 8px"><strong>Ser ${t.ser} Basis:</strong> ${esc(t.basis)}</div>`));
}
});
body.appendChild(card);
});
w.appendChild(det);
});
w.appendChild(el(`<p class="card p-3 text-xs text-ink-soft italic">Future days' Maj Cmt will be appended here as new dated sections, newest first. Bornona narrative basis is cross-referenced to each serial above.</p>`));
m.appendChild(w);
}

/* ===== CO'S DIRECTIVES ===== */
function rCoDirectives(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
w.appendChild(el(`<h2 class="text-lg font-bold mb-3">CO's Directives</h2>`));
CO_DIRECTIVES.forEach(d=>{
w.appendChild(el(`<div class="directive-box mb-3"><strong>${esc(d.title)}</strong><span class="text-xs" style="margin-left:6px;opacity:.75">${esc(d.date)}</span><ul style="margin:6px 0 0;padding-left:18px">${d.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`));
});
m.appendChild(w);
}

render();
</script>
</body>
