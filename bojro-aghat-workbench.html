let tab="flood",leafletMap=null,countdownInterval=null;
let theme="light";try{theme=localStorage.getItem("ba_theme")||"light";}catch(e){}
const R=document.getElementById("root");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;}
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);}
function toggleTheme(){theme=theme==="dark"?"light":"dark";try{localStorage.setItem("ba_theme",theme);}catch(e){}applyTheme();const b=document.getElementById("themeBtn");if(b)b.textContent=theme==="dark"?"☀️":"🌙";}
let toastTimer=null;
function showToast(msg){let t=document.getElementById("copyToast");if(!t){t=el(`<div class="copy-toast" id="copyToast"></div>`);document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1400);}
function copyText(str,elem){const done=()=>{showToast("✓ Copied: "+str);if(elem){elem.classList.remove("copied-flash");void elem.offsetWidth;elem.classList.add("copied-flash");}};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));}else{fallbackCopy(str,done);}}
function fallbackCopy(str,cb){const ta=document.createElement("textarea");ta.value=str;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){}document.body.removeChild(ta);}
function getExDayStatus(){
const start=new Date(2026,6,5,0,0,0),end=new Date(2026,6,14,23,59,59),now=new Date();
if(now<start)return{label:"Exercise starts 05 Jul 2026",pct:0,target:start,targetLabel:"Exercise Start"};
if(now>end)return{label:"Exercise complete — AAR due 22 Jul",pct:100,target:null,targetLabel:null};
const day=Math.min(10,Math.floor((now-start)/86400000)+1);
if(day>=10)return{label:`Day ${day} of 10`,pct:100,target:end,targetLabel:"Exercise End"};
return{label:`Day ${day} of 10`,pct:(day/10)*100,target:new Date(2026,6,5+day,0,0,0),targetLabel:`Day ${day+1}`};
}
function fmtCountdown(ms){
if(ms<=0)return"00:00:00:00";
const s=Math.floor(ms/1000),dd=Math.floor(s/86400),hh=Math.floor((s%86400)/3600),mm=Math.floor((s%3600)/60),ss=s%60;
const p=n=>String(n).padStart(2,'0');
return p(dd)+":"+p(hh)+":"+p(mm)+":"+p(ss);
}

const [wx,fl,uzi]=await Promise.all([
fetch(wxUrl).then(r=>{if(!r.ok)throw new Error("weather "+r.status);return r.json();}),
fetch(flUrl).then(r=>{if(!r.ok)throw new Error("flood "+r.status);return r.json();}),
fetch(uziUrl).then(r=>{if(!r.ok)throw new Error("upazila "+r.status);return r.json();})
]);
renderFlood(content,wx,fl,uzi);
const upd=document.getElementById("floodUpdated");
if(upd)upd.innerHTML=`<span class="live-dot"></span>Last updated `+new Date().toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"})+" · your local time";
}catch(e){
content.innerHTML=`<div class="card p-5 text-center"><div style="font-size:34px">⚠️</div><div class="font-bold mb-1 mt-2">Couldn't load live data</div><div class="text-sm text-ink-soft">Check your connection and tap Refresh.<br><span class="mono text-xs">(${esc(e.message||"network error")})</span></div></div>`;
}finally{if(btn)btn.disabled=false;}
}
function renderFlood(content,wx,fl,uzi){
const cur=wx.current,d=wx.daily,wc=wmo(cur.weather_code);
const today=d.precipitation_sum[0]||0,maxRain=Math.max(...d.precipitation_sum,1),peakRain=Math.max(...d.precipitation_sum);
const disc=fl.daily.river_discharge,discMax=Math.max(...disc,1),discTrendUp=disc[disc.length-1]>disc[0];
let risk,rcls,ricon,rtext;
if(peakRain>=50){risk="HIGH";rcls="risk-high";ricon="🔴";rtext="⚠️ Heavy rain on the way — flood risk is HIGH. Monitor low-lying areas, drainage, and FB locations closely, and stay in lockstep with civil admin.";}
else if(peakRain>=20){risk="MODERATE";rcls="risk-mod";ricon="🟠";rtext="Significant rain ahead — stay alert. Keep anti-flood and drainage measures ready to go.";}
else{risk="LOW";rcls="risk-low";ricon="🟢";rtext="All clear for now — no major rainfall-driven flooding indicated in the forecast window.";}
content.innerHTML=`
<section class="glance-strip">
<div class="glance-tile"><div class="glance-icon">${wc[1]}</div><div class="glance-val">${cur.temperature_2m}°C</div><div class="glance-label">Right Now</div></div>
<div class="glance-tile"><div class="glance-icon">🌧️</div><div class="glance-val">${today.toFixed(1)}mm</div><div class="glance-label">Rain Today</div></div>
<div class="glance-tile"><div class="glance-icon">📈</div><div class="glance-val">${peakRain.toFixed(1)}mm</div><div class="glance-label">Peak (7d)</div></div>
<div class="glance-tile"><div class="glance-icon">${discTrendUp?"↗️":"↘️"}</div><div class="glance-val">${discTrendUp?"Rising":"Falling"}</div><div class="glance-label">River Trend</div></div>
<div class="glance-tile ${rcls}"><div class="glance-icon">${ricon}</div><div class="glance-val">${risk}</div><div class="glance-label">Flood Risk</div></div>
</section>
<section class="grid-2 mb-4">
<div class="card p-5">
<div class="text-xs uppercase tracking-widest text-ink-soft mb-2">Current Conditions</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="font-size:46px;line-height:1">${wc[1]}</div>
<div><div class="stat-big">${cur.temperature_2m}<span class="stat-unit">°C</span></div><div class="text-sm text-ink-soft">${wc[0]}</div></div>
</div>
<div class="mt-4">
<div class="metric-row"><span class="text-sm text-ink-soft">🌧️ Rain now</span><span class="mono font-semibold">${cur.precipitation} mm</span></div>
<div class="metric-row"><span class="text-sm text-ink-soft">💧 Humidity</span><span class="mono font-semibold">${cur.relative_humidity_2m}%</span></div>
<div class="metric-row"><span class="text-sm text-ink-soft">🌡️ Feels like</span><span class="mono font-semibold">${cur.apparent_temperature}°C</span></div>
<div class="metric-row"><span class="text-sm text-ink-soft">💨 Wind</span><span class="mono font-semibold">${cur.wind_speed_10m} km/h</span></div>
</div>
</div>
<div class="card p-5">
<div class="text-xs uppercase tracking-widest text-ink-soft mb-2">Flood Risk (Indicative)</div>
<div class="mb-3"><span class="risk-badge ${rcls} ${risk!=="LOW"?"pulse":""}">${ricon} ${risk} RISK</span></div>
<p class="text-sm mb-3">${rtext}</p>
<div class="metric-row"><span class="text-sm text-ink-soft">Rain today</span><span class="mono font-semibold">${today.toFixed(1)} mm</span></div>
<div class="metric-row"><span class="text-sm text-ink-soft">Peak day (7-day)</span><span class="mono font-semibold">${peakRain.toFixed(1)} mm</span></div>
<div class="metric-row"><span class="text-sm text-ink-soft">River trend</span><span class="mono font-semibold">${discTrendUp?"↗ Rising":"↘ Falling / steady"}</span></div>
</div>
</section>
<section class="card p-5 mb-4">
<h2 class="text-lg font-bold mb-1">🌦️ 7-Day Rainfall Outlook</h2>
<div class="text-xs text-ink-soft mb-3">Daily total (mm) · max chance of rain</div>
${d.time.map((t,i)=>{const f=fmtDay(t);const mm=d.precipitation_sum[i]||0;const pct=Math.round((mm/maxRain)*100);return `<div class="rainrow"><div class="text-xs"><strong>${f.wd}</strong> ${f.dm}</div><div class="rainbar-track"><div class="rainbar-fill" style="width:${pct}%"></div></div><div class="text-xs mono text-right">${mm.toFixed(1)}mm · ${d.precipitation_probability_max[i]}%</div></div>`;}).join("")}
</section>
<section class="card p-5 mb-4">
<h2 class="text-lg font-bold mb-1">🌊 River Discharge — GloFAS Model</h2>
<div class="text-xs text-ink-soft mb-3">Modeled flow near Lakshmipur · m³/s · 7-day outlook</div>
<div class="spark">
${disc.map((v,i)=>{const f=fmtDay(fl.daily.time[i]);const h=Math.max(Math.round((v/discMax)*80),4);return `<div class="spark-col"><div class="text-xs mono">${v.toFixed(0)}</div><div class="spark-bar" style="height:${h}px"></div><div class="text-xs text-ink-soft">${f.dm}</div></div>`;}).join("")}
</div>
</section>
${renderUpazilaRainfall(uzi)}`;
}
function uziSparkline(fc){
const max=Math.max(...fc,0.1);
const W=7,G=3,H=28;
const bars=fc.map((v,i)=>{
const h=Math.max(3,Math.round(((v||0)/max)*H));
const y=H-h;
const op=(0.35+0.65*((v||0)/max)).toFixed(2);
return `<rect x="${i*(W+G)}" y="${y}" width="${W}" height="${h}" rx="1" fill="#4A87C8" fill-opacity="${op}"/>`;
}).join('');
return `<svg width="${fc.length*(W+G)-G}" height="${H}" style="display:block;overflow:visible">${bars}</svg>`;
}
function uziTrend(fc){
if(!fc||fc.length<2)return'<span style="opacity:.5">—</span>';
const h=Math.ceil(fc.length/2);
const first=fc.slice(0,h).reduce((a,b)=>a+(b||0),0)/h;
const last=fc.slice(-h).reduce((a,b)=>a+(b||0),0)/h;
const d=last-first;
if(d>1)return'<span style="color:var(--red);font-weight:600">↗ Rising</span>';
if(d<-1)return'<span style="color:var(--olive);font-weight:600">↘ Easing</span>';
return'<span style="color:var(--ink-soft)">→ Steady</span>';
}
function renderUpazilaRainfall(uzi){
if(!Array.isArray(uzi)||!uzi.length)return"";
const rows=LAKSHMIPUR_UPAZILAS.map((u,i)=>{
const dd=uzi[i]&&uzi[i].daily;
if(!dd)return{name:u.name,past24:0,fc:[0,0,0,0,0],fcTotal:0,peak:0};
const past24=dd.precipitation_sum[0]||0;
const fc=dd.precipitation_sum.slice(1).map(v=>v||0);
const fcTotal=fc.reduce((a,b)=>a+b,0);
const peak=fc.length?Math.max(...fc):0;
return{name:u.name,past24,fc,fcTotal,peak};
});
return `<section class="card p-5 mb-4">
<h2 class="text-lg font-bold mb-1">☔ Hyper-Local Rainfall — By Upazila</h2>
<div class="text-xs text-ink-soft mb-3">Lakshmipur Sadar · Ramganj · Raipur · Ramgati · Kamalnagar — Open-Meteo model data, not official BMD observations</div>
<div style="overflow-x:auto"><table><thead><tr><th>Upazila</th><th>Past 24h (mm)</th><th>5-Day Trend</th><th>5-Day Total (mm)</th><th>Peak Day (mm)</th></tr></thead><tbody>
${rows.map(r=>`<tr><td class="font-semibold">${esc(r.name)}</td><td class="mono text-xs">${r.past24.toFixed(1)}</td><td><div style="display:flex;align-items:flex-end;gap:8px">${uziSparkline(r.fc)}<div class="text-xs" style="padding-bottom:2px">${uziTrend(r.fc)}</div></div></td><td class="mono text-xs">${r.fcTotal.toFixed(1)}</td><td class="mono text-xs">${r.peak.toFixed(1)}</td></tr>`).join("")}
</tbody></table></div>
</section>`;
}

applyTheme();
render();
</script>
</body>
</html>
