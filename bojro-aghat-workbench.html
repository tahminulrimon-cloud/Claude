function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;}
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);}
let toastTimer=null;
function showToast(msg){let t=document.getElementById("copyToast");if(!t){t=el(`<div class="copy-toast" id="copyToast"></div>`);document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1400);}
function copyText(str,elem){const done=()=>{showToast("✓ Copied: "+str);if(elem){elem.classList.remove("copied-flash");void elem.offsetWidth;elem.classList.add("copied-flash");}};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));}else{fallbackCopy(str,done);}}
function fallbackCopy(str,cb){const ta=document.createElement("textarea");ta.value=str;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){}document.body.removeChild(ta);}
function getExDayStatus(){
const start=new Date(2026,7,1,0,0,0),end=new Date(2026,7,7,23,59,59),now=new Date();
if(now<start)return{label:"Field Fire Program starts 01 Aug 2026",pct:0,target:start,targetLabel:"Program Start"};
if(now>end)return{label:"ACS 2026 complete",pct:100,target:null,targetLabel:null};
const day=Math.min(7,Math.floor((now-start)/86400000)+1);
if(day>=7)return{label:`Day ${day} of 7`,pct:100,target:end,targetLabel:"Program End"};
return{label:`Day ${day} of 7`,pct:(day/7)*100,target:new Date(2026,7,1+day,0,0,0),targetLabel:`Day ${day+1}`};
}
function fmtCountdown(ms){
if(ms<=0)return"00:00:00:00";
const s=Math.floor(ms/1000),dd=Math.floor(s/86400),hh=Math.floor((s%86400)/3600),mm=Math.floor((s%3600)/60),ss=s%60;
const p=n=>String(n).padStart(2,'0');
return p(dd)+":"+p(hh)+":"+p(mm)+":"+p(ss);
}

/* ===== RENDER ===== */
function render(){
if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}
R.innerHTML="";
const shell=el(`<div>
<div class="classified-strip mono">${META.exercise}</div>
<div class="tab-nav-wrap"><nav class="container"><div class="tab-nav" id="tn"></div></nav></div>
<main id="main" style="padding-bottom:32px"></main></div>`);
R.appendChild(shell);
const tabs=[{id:"overview",l:"📋 Overview"},{id:"visit",l:"🎖️ Comd's Visit"},{id:"firing",l:"💥 Test & Field Fire"},{id:"parade",l:"📊 Parade State"},{id:"pending",l:"📇 Roster, Duty & Movement"}];
const tn=document.getElementById("tn");
tabs.forEach(t=>{const b=el(`<button class="tab ${t.id===tab?'active':''}">${t.l}</button>`);b.onclick=()=>{tab=t.id;render();};tn.appendChild(b);});
const m=document.getElementById("main");
({overview:rOverview,visit:rVisit,firing:rFiring,parade:rParade,pending:rPending})[tab](m);
}
