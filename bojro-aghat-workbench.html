let tab="overview",checked={},leafletMap=null;
const R=document.getElementById("root");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;}

/* ===== RENDER ===== */
function render(){
R.innerHTML="";
const shell=el(`<div>
<div class="classified-strip mono">${META.classification} · ${META.serial} · ${META.formation} · ${META.duration}</div>
<header style="border-bottom:1px solid var(--rule);background:var(--paper-light)">
<div class="container" style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
<div><div class="mono text-xs text-olive-dark tracking-widest">17 FIELD REGIMENT ARTILLERY · CUMILLA CANTT</div>
<h1 style="font-size:22px;font-weight:700;margin:2px 0 0">EX BOJRO AGHAT — Officer Workbench</h1></div>
<div class="mono text-xs text-ink-soft text-right hide-mobile"><div>${META.serial}</div><div>05–14 Jul 2026</div></div></div>
<nav class="container"><div class="tab-nav" id="tn"></div></nav></header>
<main id="main" style="padding-bottom:32px"></main>
<footer style="border-top:1px solid var(--rule);background:var(--paper-light);padding:10px;text-align:center;font-family:ui-monospace,monospace;font-size:9px;color:var(--ink-soft);letter-spacing:.15em">
RESTRICTED · FOR TRAINING USE ONLY · SOURCES: HQ 33 ARTY BDE GEN INSTR &amp; ANNEXES, 17 FD REGT GEN INSTR, ADMIN/MOVEMENT INSTR, BMA TARGET ANALYSIS, BORNONA SERIALS</footer></div>`);
R.appendChild(shell);
const tabs=[{id:"overview",l:"Overview"},{id:"map",l:"Map"},{id:"timeline",l:"Timeline"},{id:"appointments",l:"Appointments"},{id:"comms",l:"Comms & Rules"},{id:"dailyops",l:"Daily Ops"},{id:"rhythm",l:"2IC Battle Rhythm"}];
const tn=document.getElementById("tn");
tabs.forEach(t=>{const b=el(`<button class="tab ${t.id===tab?'active':''}">${t.l}</button>`);b.onclick=()=>{tab=t.id;render();};tn.appendChild(b);});
const m=document.getElementById("main");
({overview:rOverview,map:rMap,timeline:rTimeline,appointments:rAppt,comms:rComms,dailyops:rDailyOps,rhythm:rRhythm})[tab](m);
}

/* ===== OVERVIEW ===== */
function rOverview(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
w.innerHTML=`
<div class="grid-4 mb-5">
<div class="card p-3"><div class="text-xs uppercase tracking-widest text-ink-soft">Exercise</div><div class="mono text-sm mt-1">${META.exercise}</div></div>
<div class="card p-3"><div class="text-xs uppercase tracking-widest text-ink-soft">Formation</div><div class="mono text-sm mt-1">${META.formation}</div></div>
<div class="card p-3"><div class="text-xs uppercase tracking-widest text-ink-soft">Duration</div><div class="mono text-sm mt-1">${META.duration}</div></div>
<div class="card p-3"><div class="text-xs uppercase tracking-widest text-ink-soft">Depl Complete</div><div class="mono text-sm mt-1">${META.deplComplete}</div></div>
</div>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-2">Our Role</h2><p class="text-base">${META.role}</p></section>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-2">Concept</h2><p class="text-base">${META.concept}</p></section>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-2">End State</h2><p class="text-base">${META.endState}</p></section>
${CO_DIRECTIVES.map(d=>`<div class="directive-box mb-3"><strong>CO's Directive (${d.date}):</strong> ${esc(d.title)} — ${esc(d.text)}</div>`).join("")}
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-3">Key Personnel</h2>
<table><thead><tr><th>Appointment</th><th>Name</th><th>Contact</th></tr></thead><tbody>${PERSONNEL.map(p=>`<tr><td>${esc(p.appt)}</td><td class="font-semibold">${esc(p.name)}</td><td class="mono">${esc(p.contact)}</td></tr>`).join("")}</tbody></table></section>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-3">Ammo Allocation per Location</h2>
<table><thead><tr><th>Location</th><th>Live (Sealed)</th><th>Live (Loose)</th><th>Blank (Sealed)</th><th>Blank (Loose)</th></tr></thead><tbody>${AMMO.map(a=>`<tr><td>${esc(a.loc)}</td><td>${esc(a.live_s)}</td><td>${esc(a.live_l)}</td><td>${esc(a.blank_s)}</td><td>${esc(a.blank_l)}</td></tr>`).join("")}</tbody></table>
<p class="text-xs text-red mt-2 font-semibold">Live and blank ammunition must NEVER be stored together. Live ammo boxes marked with red scotch tape cross.</p></section>
<section class="card p-5 mb-4"><h2 class="text-lg font-bold mb-3">Code Words</h2>
<table><thead><tr><th>Word</th><th>Meaning</th><th>Used By</th></tr></thead><tbody>${CODE_WORDS.map(c=>`<tr><td class="mono font-semibold">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</tbody></table></section>
<section class="grid-2 mb-4">
${[["map","Map","Deployment areas with GPS pins"],["timeline","Timeline","Pre-ex through post-ex checklist"],["appointments","Appointments","Officer responsibilities"],["comms","Comms & Rules","Call signs, frequencies, Do's/Don'ts"],["dailyops","Daily Ops","Maj Cmt + Bornona narratives"],["rhythm","2IC Rhythm","Daily battle rhythm for 2IC"]].map(([id,t,d])=>`<button data-g="${id}" class="card p-4" style="text-align:left"><div class="font-bold">→ ${t}</div><div class="text-sm text-ink-soft">${d}</div></button>`).join("")}
</section>`;
w.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{tab=b.dataset.g;render();});
m.appendChild(w);
}

/* ===== MAP ===== */
function rMap(m){
const w=el(`<div class="container" style="padding:16px"><div class="card"><div class="map-layout"><div><div id="mapdiv" class="map-container"></div></div><aside class="map-sidebar"><div class="text-xs uppercase tracking-widest text-ink-soft">Selected feature</div><div id="mapinfo" class="mt-2 text-sm text-ink-soft">Tap any marker to see details.</div><hr style="border:none;border-top:1px solid var(--rule);margin:14px 0"/><div class="text-xs uppercase tracking-widest text-ink-soft mb-2">Legend</div><div class="space-y-2" style="font-size:12px"><div><span class="ord-marker" style="background:#4C5142;margin-right:6px">HQ</span>Home station</div><div><span class="ord-marker" style="background:#1F4E79;margin-right:6px">CTL</span>Control HQ</div><div><span class="ord-marker" style="background:#45592F;margin-right:6px">BN</span>Forward Bn</div><div><span class="ord-marker" style="background:#A6332F;margin-right:6px">GUN</span>Gun Position</div></div><p class="text-xs text-ink-soft italic mt-4">Coordinates approximate/illustrative. Authoritative grids on map sheets 79 I/15 and 79 M/3.</p></aside></div></div></div>`);
m.appendChild(w);
setTimeout(()=>{
const md=document.getElementById("mapdiv"),info=document.getElementById("mapinfo");
if(!md||typeof L==="undefined")return;
if(leafletMap){leafletMap.remove();leafletMap=null;}
leafletMap=L.map(md,{center:[23.43,91.08],zoom:11});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:18}).addTo(leafletMap);
setTimeout(()=>leafletMap.invalidateSize(),100);
LOCATIONS.forEach(loc=>{
const s=TYPE_STYLE[loc.type];
const ic=L.divIcon({className:'',html:'<div style="background:'+s.fill+';color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);padding:2px 5px;border-radius:3px;font-family:ui-monospace,monospace;font-size:9px;font-weight:600;white-space:nowrap">'+s.icon+' '+esc(loc.name)+'</div>',iconSize:[140,20],iconAnchor:[70,10]});
const mk=L.marker([loc.lat,loc.lng],{icon:ic}).addTo(leafletMap);
mk.bindPopup('<b>'+esc(loc.name)+'</b><br><span style="font-family:monospace;font-size:11px">'+loc.lat.toFixed(4)+', '+loc.lng.toFixed(4)+'</span><br>'+esc(loc.note));
mk.on("click",()=>{info.innerHTML=`<div class="font-bold text-olive-dark">${esc(loc.name)}</div><div class="mono text-xs text-ink-soft mt-1">${loc.lat.toFixed(4)}°N, ${loc.lng.toFixed(4)}°E</div><p class="text-sm mt-2">${esc(loc.note)}</p>`;});
});
},0);
}

/* ===== TIMELINE ===== */
function rTimeline(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
Object.entries(TIMELINE).forEach(([sec,items])=>{
const card=el(`<div class="card mb-4"><div class="p-3 border-b"><h2 class="text-lg font-bold" style="margin:0">${sec}</h2></div><div></div></div>`);
const body=card.querySelector("div:last-child");
items.forEach(item=>{
const row=el(`<div class="ci"><div style="flex:1"><span class="mono text-xs text-red font-semibold">${esc(item.t)}</span> <span class="itxt text-sm">${esc(item.e)}</span></div></div>`);
body.appendChild(row);
});
w.appendChild(card);
});
m.appendChild(w);
}

/* ===== APPOINTMENTS ===== */
function rAppt(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
w.appendChild(el(`<p class="text-sm text-ink-soft mb-4">Officer responsibilities for <b>EX BOJRO AGHAT</b>. Items marked ⚡ are CO's Directives (06 Jul 2026).</p>`));
APPOINTMENTS.forEach((a,idx)=>{
const d=el(`<details class="card mb-3" ${idx<2?'open':''}><summary><span>${idx+1}. ${esc(a.name)}</span></summary><div class="border-t p-4"><div class="text-sm italic text-ink-soft mb-3">${esc(a.role)}</div><ul style="list-style:none;padding:0;margin:0" class="space-y-2 text-sm"></ul></div></details>`);
const ul=d.querySelector("ul");
a.items.forEach(it=>{
const isDir=it.startsWith("⚡");
ul.appendChild(el(`<li style="display:flex;gap:8px;${isDir?'color:var(--olive-dark);font-weight:600':''}"><span class="text-olive">▸</span><span>${esc(it)}</span></li>`));
});
w.appendChild(d);
});
m.appendChild(w);
}

/* ===== DAILY OPS ===== */
function rDailyOps(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
DAILY_OPS.forEach(day=>{
w.appendChild(el(`<h2 class="text-lg font-bold mb-3">${esc(day.title)} — ${esc(day.date)}</h2>`));
day.subunits.forEach(su=>{
const card=el(`<div class="card mb-4"><div class="p-3 border-b" style="background:var(--paper-dark)"><h3 class="font-bold text-sm uppercase tracking-widest text-olive-dark" style="margin:0">${esc(su.name)}</h3></div><div style="overflow-x:auto"><table><thead><tr><th>Ser</th><th>Task</th><th>Timing</th><th>Location</th><th>Ptl Brief</th><th>Comd</th><th>Str</th><th>Veh</th><th>Umpire</th></tr></thead><tbody></tbody></table></div><div id="basis_${su.name.replace(/\W/g,'')}"></div></div>`);
const tbody=card.querySelector("tbody");
const basisDiv=card.querySelector("div:last-child");
su.tasks.forEach(t=>{
tbody.appendChild(el(`<tr><td>${t.ser}</td><td class="font-semibold">${esc(t.task)}</td><td class="mono">${esc(t.timing)}</td><td class="mono">${esc(t.loc)}</td><td>${esc(t.brief)}</td><td>${esc(t.comd)}</td><td class="mono">${esc(t.str)}</td><td>${esc(t.veh)}</td><td>${esc(t.ump)}</td></tr>`));
if(t.basis){
const isWarn=t.basis.includes("⚠");
basisDiv.appendChild(el(`<div class="${isWarn?'warn-box':'directive-box'} mb-2" style="margin:0 12px 8px"><strong>Ser ${t.ser} Basis:</strong> ${esc(t.basis)}</div>`));
}
});
w.appendChild(card);
});
});
w.appendChild(el(`<p class="card p-3 text-xs text-ink-soft italic">Future days' Maj Cmt will be appended here as new dated sections. Bornona narrative basis is cross-referenced to each serial above.</p>`));
m.appendChild(w);
}

/* ===== 2IC BATTLE RHYTHM ===== */
function rRhythm(m){
const w=el(`<div class="container" style="padding:20px 16px"></div>`);
w.appendChild(el(`<h2 class="text-lg font-bold mb-3">Daily Battle Rhythm Checklist — 2IC</h2>`));
const card=el(`<div class="card"></div>`);
BATTLE_RHYTHM.forEach((item,i)=>{
const k='br_'+i;
const row=el(`<div class="ci ${checked[k]?'done':''}"><input type="checkbox" ${checked[k]?'checked':''}/><span class="itxt text-sm">${esc(item)}</span></div>`);
row.querySelector("input").onchange=()=>{checked[k]=!checked[k];render();};
card.appendChild(row);
});
w.appendChild(card);
w.appendChild(el(`<p class="text-xs text-ink-soft italic mt-4">This checklist resets each day. Items marked ⚡ in the Appointments tab are CO's Directives integrated into the daily rhythm.</p>`));
m.appendChild(w);
}

render();
</script>
